<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facturación</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231d4ed8'/%3E%3Cpath d='M13 3 5 14h6l-1 7 8-11h-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Íconos (SVG en línea: la aplicación funciona sin internet) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-factura" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <symbol id="i-productos" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/></symbol>
    <symbol id="i-clientes" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.2 0 3.9 1.4 4.5 4"/></symbol>
    <symbol id="i-historial" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-cierre" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 16v-3M12 16V8M17 16v-5"/></symbol>
    <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></symbol>
  </svg>

  <aside class="lateral">
    <div class="marca">
      <span class="marca-logo"><svg><use href="#i-rayo"/></svg></span>
      <div class="marca-texto">
        <strong id="marcaNombre">Facturación</strong>
        <small id="marcaGiro">Ferretería</small>
      </div>
    </div>

    <nav id="menu" class="menu">
      <a href="#/facturar" data-ruta="facturar"><svg><use href="#i-factura"/></svg><span>Facturar</span><kbd>Alt+1</kbd></a>
      <a href="#/productos" data-ruta="productos"><svg><use href="#i-productos"/></svg><span>Productos</span><kbd>Alt+2</kbd></a>
      <a href="#/clientes" data-ruta="clientes"><svg><use href="#i-clientes"/></svg><span>Clientes</span><kbd>Alt+3</kbd></a>
      <a href="#/historial" data-ruta="historial"><svg><use href="#i-historial"/></svg><span>Historial</span><kbd>Alt+4</kbd></a>
      <a href="#/cierre" data-ruta="cierre"><svg><use href="#i-cierre"/></svg><span>Cierre de caja</span><kbd>Alt+5</kbd></a>
      <a href="#/configuracion" data-ruta="configuracion"><svg><use href="#i-ajustes"/></svg><span>Configuración</span><kbd>Alt+6</kbd></a>
    </nav>

    <div class="lateral-pie">
      <a id="alertaStock" class="alerta-stock" href="#/productos?bajoStock=1" hidden>
        <svg><use href="#i-alerta"/></svg><span></span>
      </a>
      <div id="fechaHoy" class="fecha-hoy"></div>
    </div>
  </aside>

  <main id="vista" class="vista"></main>
  <div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
